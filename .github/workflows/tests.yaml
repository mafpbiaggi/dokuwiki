name: Integration tests

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      artifact_name:
        required: false
        type: string
        default: ''

  pull_request:
    branches: [ '*' ]
    paths:
      - '.github/workflows/tests.yaml'
      - 'tests/**'

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      - name: Resolve image tag
        id: vars
        run: |
          if [ -n "${{ inputs.image }}" ]; then
            echo "image=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(cut -d' ' -f1 app/VERSION)
            echo "image=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download image artifact
        if: ${{ inputs.artifact_name != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/image

      - name: Load image from artifact
        if: ${{ inputs.artifact_name != '' }}
        run: docker load -i /tmp/image/image.tar

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.artifact_name == '' }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image from registry
        if: ${{ inputs.artifact_name == '' }}
        run: docker pull ${{ steps.vars.outputs.image }}

      - name: Start container
        run: |
          WORKDIR=$(pwd)
          PERSISTENT_CONF1="${WORKDIR}/tests/conf/local.php:/var/www/html/conf/local.php"
          PERSISTENT_CONF2="${WORKDIR}/tests/conf/acl.auth.php:/var/www/html/conf/acl.auth.php"
          PERSISTENT_CONF3="${WORKDIR}/tests/conf/users.auth.php:/var/www/html/conf/users.auth.php"
          docker run -d \
            --name ${{ github.event.repository.name }} \
            -p 80:80 \
            -v ${PERSISTENT_CONF1} \
            -v ${PERSISTENT_CONF2} \
            -v ${PERSISTENT_CONF3} \
            ${{ steps.vars.outputs.image }}

      - name: Wait for container readiness
        run: |
          echo "Waiting for container readiness ..."
          sleep 10

      - name: Verify container status
        run: |
          bash tests/container_status.sh ${{ github.event.repository.name }}

      - name: Check application health
        run: |
          bash tests/health_check_app.sh

      - name: Clean up temporary resources
        if: always()
        run: docker rm -f ${{ github.event.repository.name }} || true
        