name: Test

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
  
  workflow_dispatch:
    inputs:
      image:
        required: false
        type: string
      artifact_name:
        required: false
        type: string
        default: 'none'

env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}/{1}:latest', github.repository_owner, github.event.repository.name) }}

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0

      - name: Download image artifact
        if: inputs.artifact_name != 'none'
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/image

      - name: Load image from artifact
        if: inputs.artifact_name != 'none'
        run: docker load -i /tmp/image/image.tar

      - name: Log in to GitHub container registry
        if: inputs.artifact_name == 'none'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Image pull
        if: inputs.artifact_name == 'none'
        run: docker pull $IMAGE

      - name: Start container
        run: |
          WORKDIR=$(pwd)
          docker run -d \
            --name ${{ github.event.repository.name }} \
            -v ${WORKDIR}/tests/conf/local.php:/var/www/html/conf/local.php \
            -p 80:80 \
            $IMAGE

      - name: Wait for container
        run: bash tests/container_status.sh ${{ github.event.repository.name }}

      - name: Check application health
        run: bash tests/health_check_app.sh

      - name: Clean up temporary resources
        if: always()
        run: docker rm -f ${{ github.event.repository.name }} || true
