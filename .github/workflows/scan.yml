name: Scan

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      image:
        required: false
        type: string
      artifact_name:
        required: false
        type: string
        default: 'none'
env:
  IMAGE: ${{ inputs.image || format('ghcr.io/{0}/{1}:latest', github.repository_owner, github.event.repository.name) }}

jobs:
  trivy:
    runs-on: ubuntu-latest

    steps:
      - name: Download image artifact
        if: inputs.artifact_name != 'none'
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/image

      - name: Load image from artifact
        if: inputs.artifact_name != 'none'
        run: docker load -i /tmp/image/image.tar

      - name: Log in to GitHub container registry
        if: inputs.artifact_name == 'none'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Image pull
        if: inputs.artifact_name == 'none'
        run: docker pull $IMAGE

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: '${{ env.IMAGE }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
