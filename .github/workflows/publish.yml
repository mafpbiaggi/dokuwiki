name: Publish

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      artifact_name:
        required: true
        type: string

    outputs:
      image_name:
        value: ${{ jobs.image.outputs.name }}
      image_digest: 
        value: ${{ jobs.image.outputs.digest }}

jobs:
  image:
    runs-on: ubuntu-latest

    outputs:
      name: ${{ steps.push.outputs.man_name }}
      digest: ${{ steps.push.outputs.man_digest }}

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: /tmp/image

      - name: Load image from artifact
        run: docker load -i /tmp/image/image.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push Docker images
        id: push
        env:
          TAG: ${{ inputs.tag }}
          LOCAL_IMG: ${{ github.event.repository.name }}:${{ inputs.tag }}
          REMOTE_IMG: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        run: |
          for t in "$TAG"; do
            docker tag "$LOCAL_IMG" "$REMOTE_IMG:$t"
            docker push "$REMOTE_IMG:$t"
          done
          NAME=$(docker buildx imagetools inspect $REMOTE_IMG:$TAG --format '{{ .Manifest }}' | grep 'Name')
          DIGEST=$(docker buildx imagetools inspect $REMOTE_IMG:$TAG --format '{{ .Manifest }}' | grep 'Digest')
          echo "man_name=$NAME" >> "$GITHUB_OUTPUT"          
          echo "man_digest=$DIGEST" >> "$GITHUB_OUTPUT"          
