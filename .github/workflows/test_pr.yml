name: Test changes

on:
  pull_request:
    branches: [ '**' ]
    paths:
      - 'app/**'
      - 'docker/**'
      - 'release_notes'

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    
  build:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
  
  scan:
    needs: build
    uses: ./.github/workflows/scan.yml
    with:
      image: ${{ github.event.repository.name }}:${{ needs.build.outputs.tag }}
      artifact_name: ${{ needs.build.outputs.artifact }}

  test:
    needs: [ build, scan ]
    uses: ./.github/workflows/test.yml
    with:
      image: ${{ github.event.repository.name }}:${{ needs.build.outputs.tag }}
      artifact_name: ${{ needs.build.outputs.artifact }}

  publish:
    needs: [ build, test ]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.build.outputs.tag }}
      artifact_name: ${{ needs.build.outputs.artifact }}

  release:
    if: ${{ !cancelled() && !failure() }}
    needs: [ changes, publish ]
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      image_name: ${{ needs.publish.outputs.image_name }}
      image_digest: ${{ needs.publish.outputs.image_digest }}
